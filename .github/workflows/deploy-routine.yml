
name: Deploy Routine

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: routine-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RangelLab
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.JSLYNK_PAGES_TOKEN }}
          path: pages

      - name: Checkout Routine
        uses: actions/checkout@v4
        with:
          repository: jeffersonrcs-cmd/Routine
          ref: main
          token: ${{ secrets.JSLYNK_PAGES_TOKEN }}
          path: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        working-directory: source
        run: npm ci

      - name: Build Routine
        working-directory: source
        run: npm run build -- --base=/routine/

      - name: Publish Routine
        env:
          GH_TOKEN: ${{ secrets.JSLYNK_PAGES_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p pages/routine
          find pages/routine -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R source/dist/. pages/routine/

          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routine

          if ! git diff --cached --quiet; then
            git commit -m "Deploy Routine"
            git push origin HEAD:main
          fi
